name: 自动打包 APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'soups.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拎工程
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受授权 + 装 platform / build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: 注入公网更新源（用你个 repo 地址自动生成，APK 唔使手填网址）
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          F="app/src/main/assets/www/index.html"
          sed -i "s|__OWNER__|$OWNER|g; s|__REPO__|$REPO|g" "$F"
          echo "更新源 = https://raw.githubusercontent.com/$OWNER/$REPO/main/soups.json"
          grep -c "raw.githubusercontent.com/$OWNER/$REPO" "$F"

      - name: 装 Gradle 8.7（直接下载固定版，唔使 wrapper jar，工程干净啲）
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version

      - name: Build debug APK（可直接侧载安装）
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 顺手整份 iPhone／浏览器用嘅单文件 HTML
        run: |
          cp app/src/main/assets/www/index.html ./省中医汤谱_联网更新版.html
          echo "同一份页面，入面已经注入咗更新源"

      - name: 出成品
        uses: actions/upload-artifact@v4
        with:
          name: 省中医汤谱-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            soups.json
            省中医汤谱_联网更新版.html
          if-no-files-found: error
